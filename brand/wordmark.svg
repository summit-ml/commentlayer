<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 48" width="300" height="48">
  <!-- commentLayer wordmark: Helvetica bold, "comment" in ink, "Layer" muted, the mark leading. -->
  <g transform="translate(0 -8) scale(1)">
    <rect x="12" y="26" width="40" height="26" rx="7" fill="#2a2529" stroke="#f0efeb" stroke-opacity=".35" stroke-width="2.5"/>
    <rect x="12" y="14" width="40" height="26" rx="7" fill="#1f1c1f" stroke="#f0efeb" stroke-opacity=".9" stroke-width="2.5"/>
    <circle cx="40" cy="20" r="7.5" fill="#c94a8f"/>
  </g>
  <text x="62" y="36" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="-0.6">
    <tspan fill="#f0efeb">comment</tspan><tspan fill="#8f8a8d">Layer</tspan>
  </text>
</svg>
